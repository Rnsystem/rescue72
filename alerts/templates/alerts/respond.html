<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rescue72 応答</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    .box { max-width: 560px; margin: 0 auto; }
    button { width: 100%; padding: 14px; margin: 8px 0; font-size: 16px; }
    textarea, input { width: 100%; padding: 10px; font-size: 14px; }
    .muted { color: #666; font-size: 13px; }
    .row { margin: 12px 0; }
    .ok { color: green; }
    .ng { color: red; }
  </style>
</head>
<body>
  <div class="box">
    <h1>安否確認</h1>

    <p class="muted">通知を受け取った方は、該当するものを押してください。</p>

    <div class="row">
      <div class="muted">alert_id</div>
      <div id="alertId">{{ alert_id|default:"" }}</div>
    </div>

    <div class="row">
      <div class="muted">device_id（無ければ入力）</div>
      <input id="deviceId" placeholder="test-device-100" />
      <div class="muted">※ setup画面で保存しているなら自動で入ります</div>
    </div>

    <div class="row">
      <div class="muted">メモ（任意）</div>
      <textarea id="note" rows="3" placeholder="状況を一言（例：家が倒壊、けが、移動不可 など）"></textarea>
    </div>

    <button onclick="send('safe')">✅ 無事（safe）</button>
    <button onclick="send('need_help')">🆘 助けが必要（need_help）</button>
    <button onclick="send('injured')">🩹 けが（injured）</button>
    <button onclick="send('unknown')">❓ 不明（unknown）</button>

    <div class="row" id="result"></div>
  </div>

  <script>
    // ここは「今の状態で進める」= APIキー運用
    // 本番では絶対にフロントに埋めないでください（次のステップで token 化します）
    const API_KEY = "dev-api-key-change-me";

    // setup画面で保存しているなら同じキーに合わせる
    const saved = localStorage.getItem("device_id");
    if (saved) document.getElementById("deviceId").value = saved;

    async function send(code) {
      const alertId = document.getElementById("alertId").textContent.trim();
      const deviceId = document.getElementById("deviceId").value.trim();
      const note = document.getElementById("note").value.trim();

      const el = document.getElementById("result");
      el.textContent = "";

      if (!alertId) {
        el.innerHTML = '<span class="ng">alert_id がありません（通知から開いたか確認してください）</span>';
        return;
      }
      if (!deviceId) {
        el.innerHTML = '<span class="ng">device_id を入力してください</span>';
        return;
      }

      try {
        const resp = await fetch(`/api/alerts/${encodeURIComponent(alertId)}/respond/`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key": API_KEY,
          },
          body: JSON.stringify({
            device_id: deviceId,
            response_code: code,
            response_note: note,
          }),
        });

        const json = await resp.json();
        if (!resp.ok) {
          el.innerHTML = `<span class="ng">送信失敗: ${json.error || resp.status}</span>`;
          return;
        }
        el.innerHTML = `<span class="ok">送信しました: ${json.response_code}</span>`;
      } catch (e) {
        el.innerHTML = `<span class="ng">通信エラー: ${e}</span>`;
      }
    }
  </script>
</body>
</html>
